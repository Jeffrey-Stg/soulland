name: CD

on:
  pull_request:
    branches: [master]
    types: [closed]

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Read mod version
        id: version
        run: echo "mod_version=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.mod_version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if [ -n "${PR_BODY}" ]; then
            printf '%s\n' "${PR_BODY}" > release-notes.md
          else
            printf 'Released from #%s.\n' "${PR_NUMBER}" > release-notes.md
          fi

          gh release create "v${VERSION}" build/libs/*.jar \
            --target "${TARGET_SHA}" \
            --title "SoulLand ${VERSION}" \
            --notes-file release-notes.md
